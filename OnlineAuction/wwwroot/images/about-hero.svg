<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Auction hero background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A1C0E"/>
      <stop offset="45%" stop-color="#8F4A23"/>
      <stop offset="100%" stop-color="#D8A15D"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <g fill="rgba(255,255,255,0.12)">
    <circle cx="260" cy="200" r="130"/>
    <circle cx="1400" cy="160" r="90"/>
    <circle cx="1220" cy="700" r="180"/>
    <circle cx="300" cy="760" r="110"/>
  </g>
</svg>
