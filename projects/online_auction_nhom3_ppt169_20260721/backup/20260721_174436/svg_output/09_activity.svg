<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <g id="bg" data-pptx-bounds="0 0 1280 720" data-pptx-role="background">
    <rect width="1280" height="720" fill="#FFFBEB"/>
  </g>

  <g id="header" data-pptx-bounds="48 16 1184 40">
    <rect x="48" y="18" width="8" height="32" rx="4" fill="#B45309"/>
    <text x="72" y="42" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1C1917">Activity Diagram</text>
    <text x="340" y="42" font-family="Arial, sans-serif" font-size="13" fill="#78716C">Luồng đấu giá: Đăng bán → Duyệt → Cọc → Bid → Thanh toán</text>
  </g>

  <!-- Swimlanes -->
  <g id="swimlanes" data-pptx-bounds="40 64 1200 600">
    <rect x="40" y="64" width="240" height="600" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
    <rect x="280" y="64" width="240" height="600" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
    <rect x="520" y="64" width="280" height="600" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
    <rect x="800" y="64" width="220" height="600" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
    <rect x="1020" y="64" width="220" height="600" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>

    <rect x="40" y="64" width="240" height="40" fill="#FEF3C7" stroke="#FDE68A"/>
    <text x="160" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#B45309">Seller</text>
    <rect x="280" y="64" width="240" height="40" fill="#B45309" stroke="#B45309"/>
    <text x="400" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Admin</text>
    <rect x="520" y="64" width="280" height="40" fill="#FEF3C7" stroke="#FDE68A"/>
    <text x="660" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#B45309">Buyer</text>
    <rect x="800" y="64" width="220" height="40" fill="#1C1917" stroke="#1C1917"/>
    <text x="910" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">System</text>
    <rect x="1020" y="64" width="220" height="40" fill="#FEF3C7" stroke="#FDE68A"/>
    <text x="1130" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#B45309">Payment</text>
  </g>

  <!-- Start -->
  <circle cx="160" cy="130" r="11" fill="#1C1917"/>
  <line x1="160" y1="141" x2="160" y2="165" stroke="#1C1917" stroke-width="1.5"/>
  <polygon points="156,163 160,171 164,163" fill="#1C1917"/>

  <!-- Seller: Submit -->
  <rect x="70" y="171" width="180" height="42" rx="21" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="160" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#1C1917">Đăng bán listing</text>

  <line x1="250" y1="192" x2="305" y2="192" stroke="#1C1917" stroke-width="1.5"/>
  <polygon points="303,188 313,192 303,196" fill="#1C1917"/>

  <!-- Admin: Review -->
  <rect x="310" y="171" width="180" height="42" rx="21" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="400" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#1C1917">Duyệt listing</text>

  <line x1="400" y1="213" x2="400" y2="245" stroke="#1C1917" stroke-width="1.5"/>
  <polygon points="396,243 400,251 404,243" fill="#1C1917"/>

  <!-- Decision Approve/Reject -->
  <polygon points="400,251 428,279 400,307 372,279" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="400" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#B45309">OK?</text>

  <!-- Reject branch -->
  <path d="M372 279 L300 279 L300 340" fill="none" stroke="#DC2626" stroke-width="1.5"/>
  <polygon points="296,338 300,346 304,338" fill="#DC2626"/>
  <text x="310" y="272" font-family="Arial, sans-serif" font-size="10" fill="#DC2626">Reject</text>
  <rect x="220" y="346" width="160" height="36" rx="18" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="300" y="369" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#991B1B">Từ chối + lý do</text>
  <!-- Seller edit resubmit -->
  <path d="M220 364 L160 364 L160 230" fill="none" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4 3"/>
  <polygon points="156,232 160,222 164,232" fill="#DC2626"/>
  <text x="100" y="300" font-family="Arial, sans-serif" font-size="10" fill="#DC2626">Sửa &amp; gửi lại</text>

  <!-- Approve branch -->
  <line x1="400" y1="307" x2="400" y2="360" stroke="#16A34A" stroke-width="1.5"/>
  <polygon points="396,358 400,366 404,358" fill="#16A34A"/>
  <text x="412" y="340" font-family="Arial, sans-serif" font-size="10" fill="#16A34A">Approve</text>
  <rect x="310" y="366" width="180" height="36" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="400" y="389" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">scheduled / live</text>

  <line x1="490" y1="384" x2="555" y2="384" stroke="#1C1917" stroke-width="1.5"/>
  <polygon points="553,380 563,384 553,388" fill="#1C1917"/>

  <!-- Buyer: Register + Deposit -->
  <rect x="555" y="358" width="210" height="52" rx="26" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="660" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#1C1917">Đăng ký đấu giá</text>
  <text x="660" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#78716C">+ Đặt cọc PayPal</text>

  <!-- Payment: Capture deposit -->
  <path d="M765 384 L1130 384 L1130 180" fill="none" stroke="#78716C" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="1050" y="150" width="160" height="36" rx="18" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="1130" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#1C1917">Capture cọc</text>
  <path d="M1130 186 L1130 300 L765 400" fill="none" stroke="#78716C" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Bid -->
  <line x1="660" y1="410" x2="660" y2="450" stroke="#1C1917" stroke-width="1.5"/>
  <polygon points="656,448 660,456 664,448" fill="#1C1917"/>
  <rect x="555" y="456" width="210" height="42" rx="21" fill="#B45309"/>
  <text x="660" y="483" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Place Bid</text>

  <!-- System SignalR + Fraud -->
  <line x1="765" y1="477" x2="825" y2="477" stroke="#1C1917" stroke-width="1.5"/>
  <polygon points="823,473 833,477 823,481" fill="#1C1917"/>
  <rect x="830" y="435" width="170" height="36" rx="18" fill="#FEF3C7" stroke="#1C1917" stroke-width="1.5"/>
  <text x="915" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#1C1917">SignalR cập nhật</text>
  <line x1="915" y1="471" x2="915" y2="490" stroke="#1C1917" stroke-width="1.2"/>
  <rect x="830" y="490" width="170" height="36" rx="18" fill="#FEF3C7" stroke="#1C1917" stroke-width="1.5"/>
  <text x="915" y="513" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#1C1917">Anti-snipe / Fraud</text>

  <!-- Decision: auction ended? -->
  <line x1="660" y1="498" x2="660" y2="535" stroke="#1C1917" stroke-width="1.5"/>
  <polygon points="635,560 660,535 685,560 660,585" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="660" y="564" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#B45309">Hết giờ?</text>
  <text x="692" y="548" font-family="Arial, sans-serif" font-size="10" fill="#78716C">Chưa → bid tiếp</text>

  <!-- Yes finalize -->
  <path d="M685 560 L915 560 L915 540" fill="none" stroke="#16A34A" stroke-width="1.5"/>
  <polygon points="911,542 915,532 919,542" fill="#16A34A"/>
  <text x="780" y="552" font-family="Arial, sans-serif" font-size="10" fill="#16A34A">Có</text>
  <rect x="830" y="540" width="170" height="36" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="915" y="563" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#166534">Tạo Order thắng</text>

  <!-- Payment checkout -->
  <line x1="1000" y1="558" x2="1075" y2="558" stroke="#1C1917" stroke-width="1.5"/>
  <polygon points="1073,554 1083,558 1073,562" fill="#1C1917"/>
  <rect x="1080" y="536" width="140" height="44" rx="22" fill="#B45309"/>
  <text x="1150" y="563" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">PayPal / COD</text>

  <!-- End -->
  <line x1="1150" y1="580" x2="1150" y2="615" stroke="#1C1917" stroke-width="1.5"/>
  <circle cx="1150" cy="630" r="12" fill="none" stroke="#1C1917" stroke-width="3"/>
  <circle cx="1150" cy="630" r="6" fill="#1C1917"/>

  <!-- Legend -->
  <g id="legend" data-pptx-bounds="60 600 200 50">
    <circle cx="72" cy="612" r="6" fill="#1C1917"/>
    <text x="86" y="616" font-family="Arial, sans-serif" font-size="10" fill="#78716C">Start</text>
    <circle cx="140" cy="612" r="6" fill="none" stroke="#1C1917" stroke-width="2"/>
    <circle cx="140" cy="612" r="3" fill="#1C1917"/>
    <text x="154" y="616" font-family="Arial, sans-serif" font-size="10" fill="#78716C">End</text>
    <polygon points="72,640 84,650 72,660 60,650" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/>
    <text x="94" y="654" font-family="Arial, sans-serif" font-size="10" fill="#78716C">Decision</text>
  </g>

  <g id="footer" data-pptx-bounds="48 680 1184 28" data-pptx-role="footer">
    <text x="48" y="700" font-family="Arial, sans-serif" font-size="12" fill="#78716C">Nhóm 3 · CardMarket</text>
    <text x="1232" y="700" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#78716C">09 / 12</text>
  </g>
</svg>
