  <line x1="630" y1="516" x2="630" y2="575" stroke="#0F172A" stroke-width="1.5"/>
  <circle cx="630" cy="595" r="12" fill="none" stroke="#0F172A" stroke-width="3"/>
  <circle cx="630" cy="595" r="6" fill="#0F172A"/>

  <!-- Admin branch -->
  <path d="M250 345 L250 400 L900 400" fill="none" stroke="#1D4ED8" stroke-width="1.5"/>
  <polygon points="898,396 908,400 898,404" fill="#1D4ED8"/>
  <text x="280" y="385" font-family="Arial, sans-serif" font-size="10" fill="#1D4ED8">Admin</text>

  <rect x="900" y="380" width="220" height="40" rx="20" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="1010" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Login /Admin</text>

  <line x1="1010" y1="420" x2="1010" y2="470" stroke="#0F172A" stroke-width="1.5"/>
  <polygon points="1006,468 1010,476 1014,468" fill="#0F172A"/>

  <rect x="900" y="476" width="220" height="40" rx="20" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="1010" y="501" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#166534">Set Admin cookie</text>

  <line x1="1010" y1="516" x2="1010" y2="575" stroke="#0F172A" stroke-width="1.5"/>
  <circle cx="1010" cy="595" r="12" fill="none" stroke="#0F172A" stroke-width="3"/>
  <circle cx="1010" cy="595" r="6" fill="#0F172A"/>

  <!-- Note -->
  <rect x="150" y="520" width="200" height="70" rx="12" fill="#F8FAFC" stroke="#BFDBFE"/>
  <text x="250" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#1D4ED8">Dual session</text>
  <text x="250" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748B">2 cookie độc lập</text>

  <g id="footer" data-pptx-bounds="48 680 1184 28" data-pptx-role="footer">
