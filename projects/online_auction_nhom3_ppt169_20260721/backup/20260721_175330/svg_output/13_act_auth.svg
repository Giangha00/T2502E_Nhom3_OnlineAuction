  </g>

  <!-- Lanes -->
  <rect x="60" y="90" width="380" height="560" fill="#FFFFFF" stroke="#BFDBFE"/>
  <rect x="440" y="90" width="380" height="560" fill="#F8FAFC" stroke="#BFDBFE"/>
  <rect x="820" y="90" width="380" height="560" fill="#FFFFFF" stroke="#BFDBFE"/>
  <rect x="60" y="90" width="380" height="36" fill="#DBEAFE"/>
  <text x="250" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1D4ED8">User</text>
