  <text x="630" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Validate credential</text>

  <line x1="630" y1="333" x2="630" y2="375" stroke="#0F172A" stroke-width="1.5"/>
  <polygon points="626,373 630,381 634,373" fill="#0F172A"/>

