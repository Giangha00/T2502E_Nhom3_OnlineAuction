  <text x="630" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">System</text>
  <rect x="820" y="90" width="380" height="36" fill="#1D4ED8"/>
  <text x="1010" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Admin</text>

