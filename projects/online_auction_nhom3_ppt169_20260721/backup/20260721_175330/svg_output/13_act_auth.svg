  <circle cx="250" cy="160" r="10" fill="#0F172A"/>
  <line x1="250" y1="170" x2="250" y2="195" stroke="#0F172A" stroke-width="1.5"/>
  <polygon points="246,193 250,201 254,193" fill="#0F172A"/>

  <rect x="150" y="201" width="200" height="40" rx="20" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="250" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Đăng ký / Login</text>

  <line x1="250" y1="241" x2="250" y2="275" stroke="#0F172A" stroke-width="1.5"/>
  <polygon points="246,273 250,281 254,273" fill="#0F172A"/>

  <polygon points="250,281 282,313 250,345 218,313" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="250" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1D4ED8">Loại?</text>

