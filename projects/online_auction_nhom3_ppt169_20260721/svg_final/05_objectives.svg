    <text font-family="Arial, sans-serif" fill="#334155" font-size="20" x="88" y="490">Tách bảo mật Admin / User bằng</text><text font-family="Arial, sans-serif" fill="#334155" font-size="20" x="88" y="520">dual-session cookies và phân quyền động.</text></g>
