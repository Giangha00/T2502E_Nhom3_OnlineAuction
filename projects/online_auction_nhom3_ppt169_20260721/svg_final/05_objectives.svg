    <text font-family="Arial, sans-serif" fill="#334155" font-size="20" x="700" y="240">Mô phỏng thực tế: xác thực listing, cọc</text><text font-family="Arial, sans-serif" fill="#334155" font-size="20" x="700" y="270">đăng ký, chống gian lận bid, thanh toán</text><text font-family="Arial, sans-serif" fill="#334155" font-size="20" x="700" y="300">và phí nền tảng.</text></g>
