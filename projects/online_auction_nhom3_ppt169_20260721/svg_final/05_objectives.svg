    <text font-family="Arial, sans-serif" fill="#334155" font-size="20" x="88" y="240">Xây dựng nền tảng đấu giá online đầy đủ:</text><text font-family="Arial, sans-serif" fill="#334155" font-size="20" x="88" y="270">MVC, Identity, database và luồng nghiệp vụ</text><text font-family="Arial, sans-serif" fill="#334155" font-size="20" x="88" y="300">end-to-end.</text></g>
